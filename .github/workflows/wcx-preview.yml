name: WCX preview builds
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/wcx-preview.yml'
      - 'INSTALL_*.txt'
      - 'ISO-WCX-Repair*'
      - 'pluginst.inf'
      - 'README.md'
      - 'PREVIEW.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: VS2026 C++26 Windows ${{ matrix.arch }} WCX
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure Visual Studio 2026 with experimental C++26
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ matrix.arch }} -DISO_WCX_CXX_STANDARD=26
      - name: Require VS2026 and C++26 configuration
        shell: pwsh
        run: |
          $cache = Get-Content build/CMakeCache.txt
          if ($cache -notcontains 'CMAKE_GENERATOR:INTERNAL=Visual Studio 18 2026') { throw 'VS2026 generator was not selected' }
          if ($cache -notcontains 'ISO_WCX_CXX_STANDARD:STRING=26') { throw 'C++26 was not enabled' }
          Write-Host "Visual Studio 2026 C++26 Preview: ${{ matrix.arch }}"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run tests including WCX DLL loading
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify safe WCX association repair
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_repair_wcx.ps1
      - name: Upload preview binaries
        uses: actions/upload-artifact@v4
        with:
          name: ISO-WCX-${{ matrix.arch }}-preview
          path: |
            build/Release/ISO-WCX.wcx
            build/Release/ISO-WCX.wcx64
          if-no-files-found: error
          retention-days: 14
  linux:
    name: Linux core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MAME CHD fixture generator for CI only
        run: |
          bash .github/scripts/prepare-ubuntu-apt.sh
          sudo apt-get install -y --no-install-recommends mame-tools
          command -v chdman
          # chdman help prints usage and may return nonzero on valid builds.
      - name: Confirm independent ISO writer test dependency
        run: python3 -c "import ctypes.util; assert ctypes.util.find_library('archive'), 'libarchive is required for independent ISO validation'"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
  sanitizer:
    name: Linux Clang ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Confirm independent ISO writer test dependency
        run: python3 -c "import ctypes.util; assert ctypes.util.find_library('archive'), 'libarchive is required for independent ISO validation'"
      - name: Configure sanitizers
        run: |
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -O1' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
      - name: Build sanitizers
        run: cmake --build build-sanitized --parallel 2
      - name: Run parser, extraction and mutation tests with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitized --output-on-failure
  package:
    name: Total Commander ZIP installer
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Collect x86 and x64 plugins
        uses: actions/download-artifact@v4
        with:
          pattern: ISO-WCX-*-preview
          path: package
          merge-multiple: true
      - name: Build auto-installable Total Commander package
        run: |
          test -s package/ISO-WCX.wcx
          test -s package/ISO-WCX.wcx64
          # Exactly two self-contained WCX DLLs; exclude *additional*
          # third-party shared libraries from this self-contained package.
          if find package -maxdepth 1 -type f \( -iname '*.dll' -o -iname '*.so*' -o -iname '*.dylib' \) | grep -q .; then
            echo "Unexpected third-party shared library in ISO-WCX installer" >&2
            exit 1
          fi
          cp pluginst.inf PREVIEW.md INSTALL_RU.txt INSTALL_EN.txt THIRD_PARTY_NOTICES.txt package/
          (cd package && zip -9 ../ISO-WCX-preview.zip pluginst.inf PREVIEW.md INSTALL_RU.txt INSTALL_EN.txt THIRD_PARTY_NOTICES.txt ISO-WCX.wcx ISO-WCX.wcx64)
          unzip -t ISO-WCX-preview.zip
          unzip -Z1 ISO-WCX-preview.zip | grep -qx 'THIRD_PARTY_NOTICES.txt'
      - name: Upload combined preview installer
        uses: actions/upload-artifact@v4
        with:
          name: ISO-WCX-Installable-Preview
          path: ISO-WCX-preview.zip
          if-no-files-found: error
          retention-days: 14
