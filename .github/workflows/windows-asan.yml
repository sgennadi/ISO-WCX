name: Windows AddressSanitizer
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-asan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-asan:
    name: MSVC ASan - ${{ matrix.arch }}
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
    steps:
      - uses: actions/checkout@v5
      - name: Configure MSVC AddressSanitizer for C and C++
        shell: pwsh
        run: |
          cmake -S . -B build-asan -G "Visual Studio 18 2026" -A ${{ matrix.arch }} `
            -DISO_WCX_CXX_STANDARD=20 -DBUILD_TESTING=ON -DISO_WCX_ENABLE_CFG=OFF `
            -DCMAKE_C_FLAGS="/fsanitize=address /Zi" `
            -DCMAKE_CXX_FLAGS="/fsanitize=address /Zi" `
            -DCMAKE_EXE_LINKER_FLAGS="/INCREMENTAL:NO" `
            -DCMAKE_MODULE_LINKER_FLAGS="/INCREMENTAL:NO"
      - name: Compile instrumented WCX and test fixtures
        run: cmake --build build-asan --config RelWithDebInfo --parallel 2
      - name: Diagnose WIM XPRESS-HUFF regression under ASan
        shell: pwsh
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=0"
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $vsroot = (& $vswhere -latest -products * -property installationPath).Trim()
          $asanDlls = @(Get-ChildItem -Path (Join-Path $vsroot "VC/Tools/MSVC") -Filter "clang_rt.asan_dynamic-*.dll" -Recurse -File -ErrorAction SilentlyContinue)
          $arch = "${{ matrix.arch }}"
          $suffix = if ($arch -eq "x64") { "x86_64" } else { "i386" }
          $runtime = @($asanDlls | Where-Object { $_.Name -eq "clang_rt.asan_dynamic-$suffix.dll" } | Sort-Object FullName -Descending | Select-Object -First 1)
          if ($runtime.Count -eq 0) { throw "MSVC ASan runtime clang_rt.asan_dynamic-$suffix.dll not found" }
          $env:PATH = "$($runtime[0].DirectoryName);$env:PATH"
          $runtime[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "ASan runtime for $arch : $($runtime[0].FullName)"
          Write-Host "ASan candidates:"
          $asanDlls | Where-Object { $_.Name -eq "clang_rt.asan_dynamic-$suffix.dll" } | ForEach-Object { Write-Host $_.FullName }
          $dumpbin = Get-ChildItem -Path (Join-Path $vsroot "VC/Tools/MSVC") -Filter dumpbin.exe -Recurse -File | Where-Object { $_.FullName -match [regex]::Escape($arch) -or ($arch -eq "Win32" -and $_.FullName -match "Hostx64\\x86") } | Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /dependents (Join-Path (Get-Location) "build-asan/RelWithDebInfo/wim_chunked_resource_tests.exe") }
          $exe = Join-Path (Get-Location) "build-asan/RelWithDebInfo/wim_chunked_resource_tests.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "wim-asan-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "wim-asan-stderr.txt"
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $finished = $proc.WaitForExit(90000)
            if (-not $finished) {
              Write-Host "WIM test exceeded 90 seconds; preserving phase markers"
              $proc.Kill()
              $proc.WaitForExit()
            }
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            if (-not $finished) { throw "WIM XPRESS-HUFF test timed out after 90 seconds" }
            if ($proc.ExitCode -ne 0) { throw "WIM XPRESS-HUFF test exited with $($proc.ExitCode)" }
          } finally {
            if (-not $proc.HasExited) { $proc.Kill() }
            $proc.Dispose()
          }
      - name: Run remaining parser and WCX regression tests under ASan
        shell: pwsh
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=0"
        run: |
          ctest --test-dir build-asan -C RelWithDebInfo -E "^wim_chunk_table_bounds_and_xpress_huff_read_only$" --output-on-failure --timeout 180 --parallel 2
