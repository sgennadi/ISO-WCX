name: Experimental C++26 compatibility

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cxx26-experimental.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cxx26-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-cxx26:
    name: C++26 Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
          - compiler: clang-19
            cc: clang-19
            cxx: clang++-19
    steps:
      - uses: actions/checkout@v7
      - name: Install modern toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 clang-19 ninja-build python3-venv
          "${{ matrix.cxx }}" --version
      - name: Install CMake 3.31 in isolated virtual environment
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-env"
          "$RUNNER_TEMP/cmake-env/bin/python" -m pip install --disable-pip-version-check cmake==3.31.10
          echo "$RUNNER_TEMP/cmake-env/bin" >> "$GITHUB_PATH"
      - name: Configure experimental C++26
        run: |
          cmake -S . -B build-cxx26 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DISO_WCX_CXX_STANDARD=26
      - name: Compile all Linux tools and tests
        run: cmake --build build-cxx26 --parallel 2
      - name: Run full test suite under C++26
        run: ctest --test-dir build-cxx26 --output-on-failure

  windows-vs2026-cxx26:
    name: VS2026 MSVC C++26 - ${{ matrix.arch }}
    runs-on: windows-2025
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
    steps:
      - uses: actions/checkout@v7
      - name: Display modern toolchain
        shell: pwsh
        run: |
          cmake --version
          Write-Host "Windows runner image: $env:ImageOS $env:ImageVersion"
      - name: Configure Visual Studio 2026 C++26 draft dialect
        run: cmake -S . -B build-cxx26 -G "Visual Studio 18 2026" -A ${{ matrix.arch }} -DISO_WCX_CXX_STANDARD=26
      - name: Require VS2026 C++26 configuration
        shell: pwsh
        run: |
          $cache = Get-Content build-cxx26/CMakeCache.txt
          if ($cache -notcontains 'CMAKE_GENERATOR:INTERNAL=Visual Studio 18 2026') { throw 'Wrong Visual Studio generator' }
          if ($cache -notcontains 'ISO_WCX_CXX_STANDARD:STRING=26') { throw 'Wrong C++ language mode' }
      - name: Build every WCX and native parser/test target
        run: cmake --build build-cxx26 --config Release --parallel 2
      - name: Run all native and WCX ABI smoke tests
        run: ctest --test-dir build-cxx26 -C Release --output-on-failure
      - name: Check Total Commander association repair
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_repair_wcx.ps1
