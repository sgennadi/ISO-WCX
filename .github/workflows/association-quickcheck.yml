name: Image association quickchecks

on:
  pull_request:
    paths:
      - 'ISO-WCX-AssociateAll.ps1'
      - 'ISO-WCX-AssociateAll.cmd'
      - 'ISO-WCX-Repair.ps1'
      - 'tests/test_associate_all_wcx.ps1'
      - '.github/workflows/association-quickcheck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  association-fixtures:
    name: Total Commander INI safety on Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Test one-pass registration and ZIP isolation without installed TC
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_associate_all_wcx.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Bulk WCX image association regression failed' }
