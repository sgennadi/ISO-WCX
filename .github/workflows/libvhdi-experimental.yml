name: Optional libvhdi VHD/VHDX validation

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'src/virtual_disk.cpp'
      - 'src/partition_map.cpp'
      - 'include/iso_wcx/virtual_disk.hpp'
      - 'include/iso_wcx/partition_map.hpp'
      - 'tests/virtual_disk.cpp'
      - 'tests/test_libvhdi_backend.py'
      - 'tests/test_virtual_fat.py'
      - 'src/fat_volume.cpp'
      - 'include/iso_wcx/fat_volume.hpp'
      - 'CMakeLists.txt'
      - '.github/workflows/libvhdi-experimental.yml'
  pull_request:
    paths:
      - 'src/virtual_disk.cpp'
      - 'src/partition_map.cpp'
      - 'include/iso_wcx/virtual_disk.hpp'
      - 'include/iso_wcx/partition_map.hpp'
      - 'tests/virtual_disk.cpp'
      - 'tests/test_libvhdi_backend.py'
      - 'tests/test_virtual_fat.py'
      - 'src/fat_volume.cpp'
      - 'include/iso_wcx/fat_volume.hpp'
      - 'CMakeLists.txt'
      - '.github/workflows/libvhdi-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux libvhdi (non-shipping, read-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system LGPL library and independent image creator
        run: |
          sudo apt-get update
          sudo apt-get install -y libvhdi-dev pkg-config qemu-utils libarchive13
          pkg-config --modversion libvhdi
          qemu-img --version
      - name: Configure native opt-in reader
        run: cmake -S . -B build-libvhdi -DCMAKE_BUILD_TYPE=Release -DISO_WCX_WITH_LIBVHDI=ON
      - name: Build
        run: cmake --build build-libvhdi --parallel 2
      - name: Run parser, regression and real-image tests
        run: ctest --test-dir build-libvhdi --output-on-failure
      - name: Confirm optical WCX stays independent
        run: |
          test -x build-libvhdi/disc_inspect
          test -x build-libvhdi/virtual_partition_inspect
