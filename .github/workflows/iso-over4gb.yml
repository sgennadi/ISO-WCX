name: ISO Level-3 over-4-GiB hybrid authoring

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/iso_edit.cpp'
      - 'src/udf_edit.cpp'
      - 'tests/test_udf_edit.py'
      - 'src/disc.cpp'
      - 'src/archive_edit.cpp'
      - 'include/iso_wcx/**'
      - 'tests/test_iso_over4gb.py'
      - 'tools/archive_edit_fixture.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/iso-over4gb.yml'
  push:
    branches: [main]
    paths:
      - 'src/iso_edit.cpp'
      - 'src/udf_edit.cpp'
      - 'tests/test_udf_edit.py'
      - 'src/disc.cpp'
      - 'src/archive_edit.cpp'
      - 'include/iso_wcx/**'
      - 'tests/test_iso_over4gb.py'
      - 'tools/archive_edit_fixture.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/iso-over4gb.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iso-over-4gib:
    name: MBR/GPT ISO and Joliet >4 GiB with independent xorriso SHA256
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Check disk capacity and install independent ISO reader
        run: |
          df -h .
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso
          command -v xorriso
      - name: Build native editor and inspector
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target archive_edit_fixture disc_inspect --parallel 2
      - name: Real >4 GiB Level-3 MBR/GPT growth and independent readback
        run: python3 tests/test_iso_over4gb.py build/archive_edit_fixture build/disc_inspect xorriso

  vat-iso-over-4gib:
    name: Sequential VAT Level-3 >4 GiB (${{ matrix.envelope }}, ${{ matrix.scope }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        envelope: [MBR, GPT]
        scope: [iso-only, shared]
    steps:
      - uses: actions/checkout@v7
      - name: Install independent ISO reader
        run: |
          df -h .
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso
      - name: Build native editor and inspector
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target archive_edit_fixture disc_inspect --parallel 2
      - name: Write and read back a real >4 GiB VAT payload
        run: python3 tests/test_iso_over4gb.py build/archive_edit_fixture build/disc_inspect xorriso ${{ matrix.envelope }} ${{ matrix.scope }}


  type1-iso-over-4gib:
    name: Read-only Type-1 shared Level-3 >4 GiB (${{ matrix.envelope }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        envelope: [MBR, GPT]
    steps:
      - uses: actions/checkout@v7
      - name: Install independent ISO reader
        run: |
          df -h .
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso
      - name: Build native editor and inspector
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target archive_edit_fixture disc_inspect --parallel 2
      - name: Read-only shared >4 GiB authoring and independent readback
        run: python3 tests/test_iso_over4gb.py build/archive_edit_fixture build/disc_inspect xorriso type1 ${{ matrix.envelope }}
