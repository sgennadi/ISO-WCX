name: Native VHDX QEMU interoperability

on:
  pull_request:
    paths:
      - 'src/virtual_disk.cpp'
      - 'src/vhdx_reader.cpp'
      - 'include/iso_wcx/virtual_disk.hpp'
      - 'include/iso_wcx/vhdx_reader.hpp'
      - 'tests/test_qemu_vhdx_interop.py'
      - '.github/workflows/native-vhdx-qemu.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-qemu-vhdx:
    name: Independent qemu-img dynamic VHDX
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install independent QEMU image creator
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils
          qemu-img --version
      - name: Configure native CLI without disk DLLs
        run: cmake -S . -B build-qemu -DCMAKE_BUILD_TYPE=Release
      - name: Build native read-only tools
        run: cmake --build build-qemu --target virtual_partition_inspect virtual_fat_inspect --parallel 2
      - name: Verify FAT extraction from QEMU-created VHDX
        run: |
          python3 tests/test_qemu_vhdx_interop.py \
            "$(command -v qemu-img)" \
            ./build-qemu/virtual_partition_inspect \
            ./build-qemu/virtual_fat_inspect
